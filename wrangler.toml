name = "mailinpot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Override with a secret in production:
#   wrangler secret put API_SECRET
API_SECRET = "change-me-in-production"

[[kv_namespaces]]
binding = "ALLOWLIST_KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MailboxDO"

[[migrations]]
tag = "v1"
new_classes = ["MailboxDO"]
