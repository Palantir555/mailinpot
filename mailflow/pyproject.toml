[project]
name = "mailflow"
version = "0.1.0"
description = "App-agnostic inbound email client for mailinpot."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
mailinpot-allowlist = "cli.allowlist:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-httpx>=0.32",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
